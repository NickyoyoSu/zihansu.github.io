<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Homepage Preview</title>
</head>
<body>
  <p id="status" style="font-family:system-ui,sans-serif;padding:24px;color:#334155;">Loading homepage preview…</p>
  <script>
    (async () => {
      const rawUrl = `https://raw.githubusercontent.com/NickyoyoSu/zihansu.github.io/homepage-2026-research-refresh/index.html?v=${Date.now()}`;
      try {
        const response = await fetch(rawUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const html = await response.text();
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.getElementById('status').textContent = 'Preview failed to load. Please refresh in a moment.';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
